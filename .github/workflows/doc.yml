name: Documentation
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
  workflow_dispatch:

concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: true

# GitHub Pages of this repository serve the Lean blueprint (blueprint.yml), so the manual is
# built and uploaded as a workflow artifact instead of being deployed.
jobs:
  build-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: test
      - name: install dependencies
        shell: bash -l {0}
        run: |
          conda env update -n test --quiet -f environment.yml
          conda list
      - name: install package
        shell: bash -l {0}
        run: |
          pip install --no-dependencies .
      - name: build documentation
        shell: bash -l {0}
        run: |
          cd doc
          make html SPHINXOPTS="--keep-going"
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: doc/_build/html
