name: Test
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        os: ["ubuntu-latest"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "${{ matrix.python }}"
          miniforge-version: latest
          activate-environment: test
      - name: install dependencies
        shell: bash -l {0}
        run: |
          conda env update --quiet -n test -f environment.yml
          conda list
      - name: install package
        shell: bash -l {0}
        run: |
          pip install --no-dependencies .
      - name: doctest
        shell: bash -l {0}
        run: |
          python -m sage.doctest cubic_twostage
      - name: verify sample certificates
        shell: bash -l {0}
        run: |
          python -m cubic_twostage verify samples/certificates
